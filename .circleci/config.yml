# =====================================================================
# CircleCI configuration — Kingdom Defense (Tower Defense Offline)
# ---------------------------------------------------------------------
# Mỗi commit/push lên GitHub sẽ kích hoạt pipeline này.
# Mục đích: chạy unit test (Jest) tự động để tránh code lỗi merge vào main.
# =====================================================================
version: 2.1

# Orbs là các thư viện tiện ích đóng gói sẵn — đỡ phải viết tay
# `node` orb cung cấp các step như install-packages có cache thông minh
orbs:
    node: circleci/node@5.2.0

# ---------------------------------------------------------------------
# JOBS — Mỗi job là một chuỗi step chạy trên cùng một container
# ---------------------------------------------------------------------
jobs:
    # Job "test" — chạy Jest cho toàn bộ test suite
    test:
        docker:
            # Image Node 20 LTS chính thức của CircleCI (đã có git, ssh, ...)
            - image: cimg/node:20.11
        resource_class: medium      # 2 vCPU, 4 GB RAM — đủ cho jest

        steps:
            # 1) Kéo source code về workspace
            - checkout

            # 2) Cài dependencies với cache. Cache key dựa trên package-lock.json
            # → lần build sau có cùng package-lock thì restore cache, không re-install
            - node/install-packages:
                  pkg-manager: npm
                  cache-version: v1

            # 3) Chạy Jest. `--ci` đảm bảo không có watch mode, fail nếu snapshot mismatch
            - run:
                  name: Run Jest unit tests
                  command: npm test

            # 4) Lưu JUnit XML để CircleCI hiển thị summary test trên UI
            - store_test_results:
                  path: test-results

            # 5) Lưu báo cáo full (logs, junit xml) như artifact để download khi cần
            - store_artifacts:
                  path: test-results
                  destination: test-results

    # Job "lint" — kiểm tra cú pháp JS (không cần cài ESLint riêng,
    # dùng `node -c` để check syntax mọi file .js)
    syntax-check:
        docker:
            - image: cimg/node:20.11
        steps:
            - checkout
            - run:
                  name: Check syntax of all JS files
                  command: |
                      for f in *.js; do
                          echo "Checking $f"
                          node -c "$f" || exit 1
                      done

# ---------------------------------------------------------------------
# WORKFLOWS — Quy định khi nào chạy job nào
# ---------------------------------------------------------------------
workflows:
    test-on-commit:
        jobs:
            # Cả 2 job chạy SONG SONG (independent) trên mỗi commit
            - syntax-check
            - test:
                  # `requires` không bắt buộc — bỏ trống để chạy parallel với syntax-check
                  filters:
                      branches:
                          # Chạy trên TẤT CẢ branch (main, dev, feature/*, PR...)
                          only: /.*/
