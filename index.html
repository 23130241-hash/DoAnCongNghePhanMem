<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Kingdom Defense - Pro Edition</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== MAIN MENU ===== -->
<div id="main-menu" class="overlay">
    <div class="menu-box">
        <h1>KINGDOM DEFENSE</h1>
        <p class="subtitle">Bảo vệ vương quốc khỏi thế lực bóng tối</p>
        <button id="start-btn">BẮT ĐẦU CHIẾN DỊCH</button>
    </div>
</div>

<!-- ===== CAMPAIGN MAP (chưa hoàn thiện) ===== -->
<div id="campaign-map" class="overlay hidden">
    <div class="top-right-stars">⭐ Total Stars: <span id="total-stars-val">0</span></div>
    <div class="map-content">
        <h1>BẢN ĐỒ CHIẾN DỊCH</h1>
        <div class="level-nodes">
            <button class="level-node" data-level="1">Level 1</button>
            <button class="level-node locked" disabled>Level 2</button>
        </div>
    </div>
    <button id="open-upgrade-btn" class="bottom-left-btn">🛡️ Upgrade / Buy Tower</button>
</div>

<!-- ===== UPGRADE SCREEN (placeholder) ===== -->
<div id="upgrade-screen" class="overlay hidden">
    <div class="upgrade-container">
        <h2>TOWER UPGRADES</h2>
        <div id="upgrade-tree-view"></div>
        <div id="upgrade-details" class="hidden">
            <h3 id="up-name">Tên nâng cấp</h3>
            <p id="up-desc">Mô tả chi tiết</p>
            <p>Giá: <span id="up-cost">0</span> ⭐</p>
        </div>
        <div class="upgrade-actions">
            <button id="cancel-upgrade-btn">HỦY</button>
            <button id="confirm-upgrade-btn">NÂNG CẤP</button>
        </div>
    </div>
</div>

<!-- ===== VICTORY MODAL ===== -->
<div id="victory-modal" class="overlay hidden">
    <div class="menu-box">
        <h1 style="color: #2ecc71;">CHIẾN THẮNG!</h1>
        <div id="stars-display" style="font-size: 50px; margin: 10px 0;">⭐⭐⭐</div>
        <p class="subtitle">HP còn lại: <span id="final-hp">20</span></p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="next-level-btn" style="background: #3498db;">QUA MÀN</button>
            <button id="restart-victory-btn" style="background: #e67e22;">CHƠI LẠI</button>
        </div>
    </div>
</div>

<!-- ===== GAME OVER MODAL (UC08 Sequence #8) ===== -->
<div id="game-over-modal" class="overlay hidden">
    <div class="menu-box">
        <h1 style="color: #e74c3c;">GAME OVER</h1>
        <p class="subtitle">Căn cứ đã thất thủ!</p>
        <p class="subtitle" style="font-size: 16px;">
            Wave đạt được: <span id="go-wave-reached">0/0</span>
        </p>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button id="go-retry-btn" style="background: #e67e22;">🔄 CHƠI LẠI</button>
            <button id="go-home-btn" style="background: #3498db;">🏠 MÀN HÌNH CHÍNH</button>
        </div>
    </div>
</div>

<!-- ===== GAME CONTAINER ===== -->
<div id="game-container" class="hidden">
    <div id="game-controls">
        <button id="pause-btn" title="Tạm dừng/Tiếp tục">⏸️</button>
        <button id="retry-btn" title="Chơi lại">🔄</button>
    </div>

    <div id="top-bar">
        <div class="stat-box hp">❤️ <span id="hp-val">20</span>/<span id="hp-max-val">20</span></div>
        <div class="stat-box gold">💰 <span id="gold-val">200</span></div>

        <div id="tower-slots">
            <div class="slot active" data-type="archer" data-cost="50">
                <div class="icon">🏹</div>
                <div class="cost">50g</div>
            </div>
            <div class="slot active" data-type="cannon" data-cost="100">
                <div class="icon">💣</div>
                <div class="cost">100g</div>
            </div>
            <div class="slot locked"><div class="icon">🔒</div><div class="cost">---</div></div>
            <div class="slot locked"><div class="icon">🔒</div><div class="cost">---</div></div>
            <div class="slot locked"><div class="icon">🔒</div><div class="cost">---</div></div>
        </div>

        <div class="stat-box wave">Wave: <span id="wave-val">0/3</span></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Lớp phủ nháy đỏ khi enemy lọt căn cứ (UC08 Sequence #5) -->
    <div id="flash-overlay"></div>

    <div id="tower-menu" class="hidden">
        <button id="upgrade-btn" disabled>Nâng cấp</button>
        <button id="sell-btn">Bán (<span id="sell-price">25</span>g)</button>
        <button id="close-menu-btn">❌ Đóng</button>
    </div>

    <div id="ui-messages"></div>
</div>

<!-- Tách config riêng để dễ thêm/sửa map, quái, tháp -->
<script src="config.js"></script>
<script src="game.js"></script>
</body>
</html>
